<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS Home Shopping Manager</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="brand">SHOPPING APP</p>
        <h1>Manage your home shopping</h1>
        <nav class="top-nav">
          <button id="nav-shopping" class="nav-btn active">Shopping List</button>
          <button id="nav-manual" class="nav-btn">No-EAN Items</button>
        </nav>
      </header>

      <section id="shopping-view" class="view">
        <div class="hero-card">
          <div>
            <p class="hero-title">Scan & Add</p>
            <p class="helper-text">Use your camera to scan EAN/QR codes.</p>
          </div>
          <button id="add-scan-btn" class="primary-btn">Add</button>
        </div>

        <label class="lookup-toggle" for="ean-lookup-enabled">
          <input id="ean-lookup-enabled" type="checkbox" checked />
          <span>Try product name lookup from EAN (optional)</span>
        </label>

        <p id="lookup-status" class="helper-text"></p>

        <ul id="shopping-list" class="shopping-list"></ul>
      </section>

      <section id="manual-view" class="view hidden">
        <h2>Add product without EAN</h2>
        <form id="manual-form" class="manual-form">
          <input id="manual-name" type="text" placeholder="e.g. Bananas" required />
          <button type="submit" class="primary-btn">Add no-EAN Item</button>
        </form>
        <p class="helper-text">Each item gets an ID and QR payload <code>NOEAN:&lt;id&gt;</code>.</p>

        <ul id="manual-items" class="manual-items"></ul>
      </section>
    </main>

    <dialog id="scanner-modal" class="scanner-modal">
      <div class="scanner-header">
        <h3>Scan barcode / QR</h3>
        <button id="close-scan-btn" class="ghost-btn">Cancel</button>
      </div>
      <div id="scanner-reader" class="scanner-reader"></div>
      <p id="scan-status" class="helper-text">Point camera at an EAN barcode or NOEAN QR code.</p>
    </dialog>

    <dialog id="confirm-scan-modal" class="scanner-modal confirm-modal">
      <div class="scanner-header">
        <h3>Confirm scanned item</h3>
        <button id="confirm-scan-cancel-top" class="ghost-btn">Close</button>
      </div>
      <div class="confirm-grid">
        <p id="confirm-scan-code" class="helper-text"></p>
        <label class="confirm-label" for="confirm-scan-name">Product name</label>
        <input id="confirm-scan-name" class="confirm-input" type="text" placeholder="Edit product name before adding" />
        <p id="confirm-scan-source" class="helper-text"></p>
        <div class="item-controls">
          <button id="confirm-scan-cancel" class="ghost-btn">Cancel</button>
          <button id="confirm-scan-add" class="primary-btn">Add to list</button>
        </div>
      </div>
    </dialog>

    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <script src="./app.js"></script>
  </body>
</html>
